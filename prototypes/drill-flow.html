<!--
PROTOTYPE. Throwaway. Not production code.

Question (Drill flow, wayfinder ticket #9): what is the flow around the card?
The start screen, choosing tables, the transition into a drill, the
end-of-drill summary, and where the speed run is entered from. Resolve with
the flow the learner navigates without help.

Three variants of the flow on one page, switchable with ?variant=A|B|C, the
floating bar at the bottom, or the left/right arrow keys. The card itself is
fixed: variant A from the Speaking-mode card ticket, with the dragon in the
feedback. The speed run follows the Speed run rules ticket and is the same in
every variant; only its entry point moves.

  A  One start screen. Three table tiles that toggle (all on by default and
     remembered), one big Practise button, Speed run as a second button
     underneath with the best beside it. One tap starts the drill.
  B  Doors. Four big tiles (6s, 8s, 12s, All three); tapping one opens a
     short Ready screen, then Go. No mixing of two tables. Speed run is a
     banner along the bottom.
  C  Dragon guide. The dragon asks which tables (chips), then what to do
     (Practise or Speed run), then says go. Three steps, each in a speech
     bubble.

Progress (levels, drill records, personal best) is held in memory only and
lost on reload. The Seed button on the bar fills in fake progress so the
start screens look lived in.
-->
<style>

  }
  :root[data-theme="dark"] {

    --card: #1E2338;
    --ink: #EEF0FA;
    --muted: #9AA1C2;
    --line: #2F3652;

  /* Shared type */

  .fb .sum b { color: var(--ink); font-weight: 700; }

  @keyframes jump { 0% { transform: translateY(0); } 35% { transform: translateY(-14%) scale(1.12); } 65% { transform: translateY(0); } 82% { transform: translateY(-5%); } 100% { transform: translateY(0); } }
  @keyframes nod { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }

  .tally .s b { color: var(--slow); }

  .s-b .hero { display: flex; align-items: center; justify-content: center; gap: 16px; }

  /* ---- Variant C: dragon guide ---- */
  .s-c { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
  .guide { display: flex; align-items: center; gap: 16px; width: min(100%, 680px); }

    position: relative;
    flex: 1;
    background: var(--ground);
    border-radius: 24px;
    padding: 20px 24px;
    font-family: "Fredoka", system-ui, sans-serif;

  .chips { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

  .s-c .btnrow { width: min(100%, 680px); margin-top: 0; }
  .s-c .big { min-height: 96px; font-size: 28px; }

  /* Prototype chrome: not part of the design under review. */
  #proto {

    left: 50%;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));

  #state {

    font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.5;
    z-index: 21;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  #state h2 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; }
  #state .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
  #state .lv { padding: 4px 6px; border-radius: 6px; background: rgba(127, 127, 127, 0.25); display: flex; justify-content: space-between; }
  #state .lv.l0 { background: rgba(222, 90, 82, 0.5); }

  @media (prefers-reduced-motion: reduce) {
    .fb, .fb .char, .fb .spark, .stage.enter, .dragon.idle, .bubble, .count { animation: none !important; }

  }
</style>

<div id="app"></div>

<div id="proto" role="toolbar" aria-label="Prototype controls">
  <button id="prev" aria-label="Previous variant">◀</button>
  <span class="label" id="label">A</span>
  <button id="next" aria-label="Next variant">▶</button>
  <span class="sep"></span>
  <button id="homeBtn" title="Back to the start screen">⌂</button>
  <button id="seedBtn" title="Fill in fake progress">seed</button>
  <button id="stateBtn" title="Show progress state">state</button>
  <button id="resetBtn" title="Wipe progress">↺</button>
</div>
<div id="state" hidden></div>

<script>
(function () {
  'use strict';

  // ---------- Progress (Drill model + Progress storage, in memory only) ----------
  var LIMIT = 3000;
  var DRILL_LENGTH = 20;
  var TABLES = [6, 8, 12];
  var WEIGHTS = [8, 4, 2, 1, 1];
  var DRAGON = '🐉';

  function buildFacts() {
    var seen = {}, facts = [];
    TABLES.forEach(function (t) {
      for (var k = 1; k <= 12; k++) {
        var a = Math.min(t, k), b = Math.max(t, k), key = a + 'x' + b;
        if (!seen[key]) { seen[key] = true; facts.push({ a: a, b: b, key: key, level: 0 }); }
      }
    });
    return facts;
  }

  var facts, records, prefs;
  function resetProgress() { facts = buildFacts(); records = []; prefs = { tables: [6, 8, 12] }; }
  function seedProgress() {
    facts.forEach(function (f) { f.level = Math.floor(Math.random() * 5); });
    records.push({ mode: 'drill', tables: [6, 8, 12], fast: 12, slow: 5, missed: 3, quit: false, time: null });
    records.push({ mode: 'speed', tables: [6, 8, 12], fast: 25, slow: 6, missed: 4, quit: false, time: 118900 });
    records.push({ mode: 'speed', tables: [6, 8, 12], fast: 28, slow: 4, missed: 2, quit: false, time: 102300 });
  }
  function personalBest() {
    var best = null;
    records.forEach(function (r) { if (r.mode === 'speed' && !r.quit && (best === null || r.time < best)) best = r.time; });
    return best;
  }
  function fmtTime(ms) {
    var s = ms / 1000, m = Math.floor(s / 60), r = s - m * 60;
    var rs = r.toFixed(1);
    return m ? m + ':' + (r < 10 ? '0' : '') + rs : rs + 's';
  }
  function tableLabel(tables) {
    if (tables.length === 3) return 'all three tables';
    return tables.map(function (t) { return t + 's'; }).join(' and ');
  }
  function tableFrom(tables) { return tables.length === 3 ? 'all three tables' : 'the ' + tableLabel(tables); }
  function poolFor(tables) {
    return facts.filter(function (f) { return tables.indexOf(f.a) !== -1 || tables.indexOf(f.b) !== -1; });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }

  }

  }

    if (outcome === 'fast') f.level = Math.min(4, f.level + 1);

    else f.level = 0;
  }

  // ---------- Drill ----------
  var drill = null;
  function newDrill(tables) {

  }
  function draw() {
    var pool = drill.pool.filter(function (f) { return drill.recent.indexOf(f.key) === -1; });
    var total = pool.reduce(function (s, f) { return s + WEIGHTS[f.level]; }, 0);
    var r = Math.random() * total;
    for (var i = 0; i < pool.length; i++) { r -= WEIGHTS[pool[i].level]; if (r < 0) return pool[i]; }
    return pool[pool.length - 1];
  }
  function applyOutcome(outcome) {
    var f = drill.current.fact;
    grade(f, outcome);
    if (outcome === 'fast') { drill.fast++; drill.streak++; }
    else if (outcome === 'slow') { drill.slow++; drill.streak = 0; }
    else { drill.missed++; drill.streak = 0; }
    drill.recent.push(f.key);
    if (drill.recent.length > 3) drill.recent.shift();
    drill.index++;
    if (drill.index >= DRILL_LENGTH) drill.done = true;
  }
  function recordDrill() {
    if (drill.recorded) return;

  // ---------- Timer ----------
  function runTimer(onFrame, onDrain) {
    var t0 = performance.now(), raf, stopped = false, drained = false;

      var e = now - t0, p = Math.max(0, 1 - e / LIMIT);
      onFrame(p);
      if (e >= LIMIT) { drained = true; onDrain(); return; }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return {
      drained: function () { return drained; },
      stop: function () { stopped = true; cancelAnimationFrame(raf); }
    };
  }

    if (speedRun) html += '<h2 style="margin-top:10px">Speed run</h2>shown ' + speedRun.shown + ' · left ' + speedRun.queue.length + ' · f' + speedRun.fast + ' s' + speedRun.slow + ' m' + speedRun.missed + '<br>';
    html += '<h2 style="margin-top:10px">Levels (33 facts)</h2><div class="levels">';
    facts.forEach(function (f) { html += '<div class="lv l' + f.level + '"><span>' + f.key + '</span><b>' + f.level + '</b></div>'; });
    stateEl.innerHTML = html + '</div>';
  }

  resetProgress();
  setVariant(settings.variant);
})();
</script>
